<!DOCTYPE html>
<html lang="th"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>Profile | VolunteeU</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* ===== Logout Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
}

.modal-overlay.show { display: flex; }

.modal-card {
  width: min(560px, 92vw);
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.18);
  padding: 32px 28px;
  text-align: center;
}

.modal-title {
  margin: 0 0 22px 0;
  font-size: 26px;
  font-weight: 700;
  color: #333;
}

.modal-actions {
  display: flex;
  gap: 18px;
  justify-content: center;
  align-items: center;
  margin-top: 10px;
  flex-wrap: wrap;
}

/* ปุ่มสไตล์ */
.btn {
  padding: 14px 28px;
  border-radius: 16px;
  border: 1px solid #ddd;
  font-weight: 700;
  font-size: 18px;
  cursor: pointer;
}

.btn-primary {
  background: #A3062C; /* โทนแบรนด์ */
  color: #fff;
  border: none;
}

.btn-ghost {
  background: #fff;
  color: #7a7a7a;
  border: 1px solid #d9d9d9;
}

.btn:focus { outline: 3px solid #EEE4F3; }

/* ปรับสำหรับจอเล็ก */
@media (max-width: 480px) {
  .modal-card { padding: 26px 22px; }
  .btn { width: 100%; }
}

    body {
      background-color: #fafafa;
      font-family: 'Inria Sans', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .main-content {
      flex-grow: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .profile-wrapper {
  background: #fff;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
  width: 700px;
  margin: 60px auto 60px auto;
  padding: 45px 60px; 
}


    .profile-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background-color: #EEE4F3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: #6B2A7C;
      margin-bottom: 15px;
    }

    .profile-email {
      font-size: 16px;
      color: #555;
      margin-bottom: 35px;
    }

    .section-title {
      font-size: 22px;
      font-weight: bold;
      color: #A3062C;
      text-align: left;
      width: 100%;
      margin-bottom: 25px;
    }

    .profile-form {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 40px;
      row-gap: 28px;
      text-align: left;
    }

    .profile-form label {
      font-weight: 700;
      color: #444;
      display: block;
      margin-bottom: 6px;
    }

    .profile-form input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      color: #333;
      background-color: #fafafa;
    }

    .profile-form input[readonly] {
      background-color: #f9f9f9;
      color: #666;
    }

    @media (max-width: 700px) {
      .profile-wrapper {
        width: 90%;
        padding: 30px;
      }

      .profile-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">VolunteeU</div>
    <div class="nav-links">
      <a href="/">Home</a>

      <th:block sec:authorize="hasRole('STUDENT')">
        <a th:href="@{/student/applications}">Application</a>



      </th:block>

      <th:block sec:authorize="hasRole('TEACHER')">
        <a th:href="@{/teacher/jobs}">Posts</a>
        <a th:href="@{/teacher/applicant}">Applicant</a>
        <a th:href="@{/teacher/interview}">Interview</a>
        <a th:href="@{/teacher/final}">Final</a>
      </th:block>

 

      <th:block sec:authorize="isAuthenticated()">
        <a th:href="@{/profile}" class="active" style="font-weight: bold;" >Profile</a>

          <!-- 🔔 กระดิ่งแจ้งเตือน สำหรับ student เท่านั้น -->
          <th:block sec:authorize="hasRole('STUDENT')">
              <div class="notification-container">
                  <a href="#" class="notification-bell" onclick="toggleNotificationPopup(event)">
                      <i data-lucide="bell"></i>
                      <span class="badge" th:text="${notificationCount}"
                            th:if="${notificationCount > 0}"></span>
                  </a>
                  <!-- กล่อง popup -->
                  <div id="notification-box" class="notification-popup">
                      <h3><strong>Notifications</strong></h3>
                      <ul th:if="${notifications != null && !notifications.isEmpty()}">
                          <!-- message ที่จะแจ้งใน noti -->
                          <li th:each="noti : ${notifications}"><a th:href="@{${noti.linkUrl}}" th:text="${noti.description}">ข้อความ</a>
                              
                              <div class="notif-time" th:text="${#temporals.format(noti.createdAt, 'dd MMM yyyy, HH:mm', 'Asia/Bangkok')}">
                                  เวลา
                              </div>
                          </li>
                      </ul>
                      <div th:if="${notifications == null || notifications.isEmpty()}" style="padding: 10px;">
                          ไม่มีการแจ้งเตือน
                      </div>
                  </div>
              </div>
          </th:block>

        
      </th:block>



      <th:block sec:authorize="isAnonymous()">
        <a href="/login">Login</a>
      </th:block>
    </div>
  </div>

  <!-- Main -->
  <div class="main-content">
    <div class="profile-wrapper">
      <div class="profile-container">
        <div class="profile-avatar">👤</div>
        <div class="profile-email" th:text="${user.email}">xxxxxx@dome.tu.ac.th</div>
      </div>

      <div class="section-title">Personal Detail</div>

      <div class="profile-form">
        <div>
          <label>First Name</label>
          <input type="text"
                 th:value="${user.displayNameEn != null ? #strings.listSplit(user.displayNameEn, ' ')[0] : ''}" readonly />
        </div>

        <div>
          <label>Last Name</label>
          <input type="text"
                 th:value="${user.displayNameEn != null ? #strings.listSplit(user.displayNameEn, ' ').size() > 1 ? #strings.listSplit(user.displayNameEn, ' ')[1] : '' : ''}"
                 readonly />
        </div>

        <div>
          <label th:text="${
            #authorization.expression('hasRole(''ROLE_ADMIN'')') ? 'Admin ID' :
            (#authorization.expression('hasRole(''ROLE_TEACHER'')') ? 'Teacher ID' : 'Student ID')
          }"></label>
          <input type="text" th:value="${user.username}" readonly />
        </div>



  <!-- logout-->
<div style="grid-column: span 2; text-align: center; margin-top: 20px;">
  <form id="logoutForm" th:action="@{/logout}" method="post" th:object="${_csrf}">
    <input type="hidden" th:name="*{parameterName}" th:value="*{token}" />
    <button type="button"
      onclick="openLogoutModal()"
      style="padding: 10px 25px;
             background-color: #A3062C;
             border: none;
             border-radius: 8px;
             color: white;
             font-weight: 600;
             cursor: pointer;
             transition: background-color 0.2s;">
      Logout
    </button>
  </form>
</div>
<div id="logoutModal" class="modal-overlay" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="logoutModalTitle">
    <h3 id="logoutModalTitle" class="modal-title">Confirm logout ?</h3>

    <div class="modal-actions">
      <button id="confirmLogoutBtn" class="btn btn-primary">confirm</button>
      <button type="button" class="btn btn-ghost" onclick="closeLogoutModal()">cancel</button>
    </div>
  </div>
</div>
<!---->



      </div>
    </div>
  </div>

  <script>
      lucide.createIcons();

      function toggleNotificationPopup(event) {
          event.preventDefault();
          const popup = document.getElementById('notification-box');
          popup.classList.toggle('show');
      }

      //ปิด popup เมื่อคลิกข้างนอก
      document.addEventListener('click', function (event) {
          const popup = document.getElementById('notification-box');
          const bell = document.querySelector('.notification-bell');

          if (!popup.contains(event.target) && !bell.contains(event.target)) {
              popup.classList.remove('show');
          }
      });
  </script>
  <!--logout -->
   <script>
  const modal = document.getElementById('logoutModal');
  const confirmBtn = document.getElementById('confirmLogoutBtn');
  const logoutForm = document.getElementById('logoutForm');

  function openLogoutModal() {
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');

    setTimeout(() => confirmBtn.focus(), 0);

    modal.addEventListener('click', backdropClose);

    document.addEventListener('keydown', escClose);
  }

  function closeLogoutModal() {
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
    modal.removeEventListener('click', backdropClose);
    document.removeEventListener('keydown', escClose);
  }

  function backdropClose(e) {
    if (e.target === modal) closeLogoutModal();
  }

  function escClose(e) {
    if (e.key === 'Escape') closeLogoutModal();
  }


  confirmBtn.addEventListener('click', function () {

    closeLogoutModal();
    logoutForm.submit();
  });
</script>

  <div class="footer">
    © 2025 VolunteeU — Software Project Recruitment
  </div>
</body>
</html>
