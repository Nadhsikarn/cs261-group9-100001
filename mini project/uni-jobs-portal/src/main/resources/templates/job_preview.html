<!DOCTYPE html>
<html lang="th"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ใบสมัครของฉัน</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .job-header-meta {
            margin-top: 6px;
            margin-bottom: 12px;
            font-size: 16px;
            color: #777777;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .job-header-meta span {
            white-space: nowrap;
        }

        .job-header-meta .separator {
            color: #cccccc;
            font-weight: 400;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">VolunteeU</div>
        <div class="nav-links">
            <a href="/">Home</a>

            <th:block sec:authorize="hasRole('STUDENT')">
                <a th:href="@{/student/applications}" class="active" style="font-weight: bold;">Application</a>
            </th:block>

            <th:block sec:authorize="hasRole('TEACHER')">
                <a th:href="@{/teacher/jobs}">Posts</a>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/profile}">Profile</a>

            <!-- 🔔 กระดิ่งแจ้งเตือน -->
                <div class="notification-container">
                    <a href="#" class="notification-bell" onclick="toggleNotificationPopup(event)">
                        <i data-lucide="bell"></i>
                        <span class="badge" th:text="${notificationCount}"
                              th:if="${notificationCount > 0}"></span>
                    </a>
                    <!-- กล่อง popup -->
                    <div id="notification-box" class="notification-popup">
                        <h3><strong>Notifications</strong></h3>
                        <ul th:if="${notifications != null && !notifications.isEmpty()}">
                            <!-- message ที่จะแจ้งใน noti -->
                            <li th:each="noti : ${notifications}"><a th:href="@{${noti.linkUrl}}" th:text="${noti.description}">ข้อความ</a>
                                
                                <div class="notif-time" th:text="${#temporals.format(noti.createdAt, 'dd MMM yyyy, HH:mm', 'Asia/Bangkok')}">
                                    เวลา
                                </div>
                            </li>
                        </ul>
                        <div th:if="${notifications == null || notifications.isEmpty()}" style="padding: 10px;">
                            ไม่มีการแจ้งเตือน
                        </div>
                    </div>
                </div>

                
            </th:block>

            <th:block sec:authorize="isAnonymous()">
                <a href="/login">Login</a>
            </th:block>
        </div>
    </div>


    <div class="job-box">
            <div class="page-header">
        <h1 th:text="${job.title}">ชื่อของงาน</h1>


        <div class="job-header-meta">
            <span>
                เปิดรับสมัคร :
                <span th:text="${#temporals.format(job.openDate, 'd MMMM yyyy', 'Asia/Bangkok')}">
                    1 มีนาคม 2569
                </span>
            </span>

            <span class="separator">|</span>

            <span>
                ปิดรับสมัคร :
                <span th:text="${#temporals.format(job.closeDate, 'd MMMM yyyy', 'Asia/Bangkok')}">
                    15 มีนาคม 2569
                </span>
            </span>
        </div>

        <div class="section-divider"></div>
    </div>

        <img th:if="${job.image != null}"
             th:src="@{${job.image.imagePath}}"
             alt="job-image"
             style="width:100%; max-width:600px; border-radius:10px;">

        <img th:if="${job.image == null}"
             src="/image/event-full.png"
             alt="default-image"
             style="width:100%; max-width:600px; opacity:0.7;">

     <div class="page-description">
                <h1>Description</h1>
                <div class="section-divider"></div>
        </div>

    <div class="job-description"
     th:utext="${#strings.replace(job.description, '\n', '<br/>')}">
</div>


    <div class="job-footer">
            <button onclick="window.location.href='/'" class="cancel-btn">Cancel</button> 
            <a th:href="@{|/jobs/${job.id}|}" class="apply-btn">Apply Now</a>
    </div>
    </div>
    
    <div class="footer">
        © 2025 VolunteeU — Software Project Recruitment
    </div>


    <script>
        lucide.createIcons();
    </script>

    <script>
        function toggleNotificationPopup(event) {
            event.preventDefault();
            const popup = document.getElementById('notification-box');
            popup.classList.toggle('show');
        }

        //ปิด popup เมื่อคลิกข้างนอก
        document.addEventListener('click', function (event) {
            const popup = document.getElementById('notification-box');
            const bell = document.querySelector('.notification-bell');

            if (!popup.contains(event.target) && !bell.contains(event.target)) {
                popup.classList.remove('show');
            }
        });
    </script>
    


</body>
</html>
