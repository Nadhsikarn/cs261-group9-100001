<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Job</title>

    <!-- Font & CSS เหมือนหน้า Create -->
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/teacher_job_new.css">   <!-- ⭐ สำคัญมาก -->
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">VolunteeU</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/teacher/jobs" class="active" style="font-weight: bold;">Posts</a>
        <a href="/teacher/applicant">Applicant</a>
        <a href="/teacher/interview">Interview</a>
        <a href="/teacher/final">Final</a>
        <a href="/profile">Profile</a>
    </div>
</div>

<div class="main-content">

    <h2>แก้ไขงาน</h2>

    <form method="post"
          th:action="@{'/teacher/jobs/' + ${job.id} + '/edit'}"
          enctype="multipart/form-data">

        <!-- TITLE -->
        <div class="job-name">
            <label>ชื่อเรื่อง</label><br/>
            <input type="text" name="title" th:value="${job.title}" required style="width:35%"/>
        </div>

        <!-- DESCRIPTION -->
        <div class="job-desc">
            <label>รายละเอียด</label><br/>
            <textarea name="description" required style="width:35%;height:120px"
                      th:text="${job.description}"></textarea>
        </div>

        <!-- SKILL -->
        <div class="job-quiz">
            <label>Skill ที่ต้องการในแต่ละฝ่าย</label><br/>
            <textarea name="requiredSkill" required style="width:35%;height:80px"
                      th:text="${job.requiredSkill}"></textarea>
        </div>

        <!-- DATES -->
        <div class="job-date">
            <label>วันที่เปิดรับสมัคร</label><br/>
            <input type="date" name="openDate" th:value="${job.openDate}" required style="width:35%" /><br/>

            <label>วันที่ปิดรับสมัคร</label><br/>
            <input type="date" name="closeDate" th:value="${job.closeDate}" required style="width:35%" />
        </div>

        <!-- IMAGE -->
        <div class="job-img">
            <label>รูปภาพปัจจุบัน</label><br/>
            <img th:if="${job.image != null}"
                 th:src="@{${job.image.imagePath}}"
                 style="max-width:250px; border-radius:8px; margin-bottom:10px;">
            <p th:if="${job.image == null}" style="color:#777;">ยังไม่มีรูปภาพ</p>

            <label>อัปโหลดรูปใหม่</label><br/>
            <input type="file" name="image" accept="image/*" style="width:35%; padding:5px;"/>
        </div>

        <!-- BUTTONS -->
        <div class="savenback-btn">
            <div class="save-btn">
                <button type="submit" class="job-save">บันทึก</button>
            </div>

            <div class="back-btn">
                <a th:href="@{/teacher/jobs}" class="job-back">ย้อนกลับ</a>
            </div>
        </div>
    </form>

</div>

<div class="footer">
    © 2025 VolunteeU — Software Project Recruitment
</div>

</body>
</html>
