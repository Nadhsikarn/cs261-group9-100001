<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Job</title>

    <!-- Font & CSS เหมือนหน้า Create -->
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/teacher_job_new.css">   <!-- ⭐ สำคัญมาก -->
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">VolunteeU</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/teacher/jobs" class="active" style="font-weight: bold;">Posts</a>
        <a href="/teacher/applicant">Applicant</a>
        <a href="/teacher/interview">Interview</a>
        <a href="/teacher/final">Final</a>
        <a href="/profile">Profile</a>
    </div>
</div>

<div class="main-content">

    <h2>Edit post</h2>

    <form method="post"
          th:action="@{'/teacher/jobs/' + ${job.id} + '/edit'}"
          enctype="multipart/form-data">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="grid-box">

            <!-- กล่องซ้าย -->
            <div class="job-bigbox">

                <div class="job-name">
                    <h3>แก้ไขรายละเอียดงาน</h3><br/>
                    <label>ชื่องาน</label>
                    <input type="text" name="title" required
                           th:value="${job.title}" />
                </div>

                <div class="job-desc">
                    <label>รายละเอียด</label>
                    <textarea name="description" required
                              th:text="${job.description}"></textarea>
                </div>

                <div class="job-quiz">
                    <label>Skill ที่ต้องการในแต่ละฝ่าย</label>
                    <textarea name="requiredSkill" required
                              th:text="${job.requiredSkill}"></textarea>
                </div>

            </div>

            <!-- กล่องขวา -->
            <div class="upload-n-date">

                <!-- รูปภาพ -->
                <label for="image-upload">
                    <div class="job-img">
                        <div class="preview-area">
                            <img id="preview-image"
                                 th:src="${job.image != null ? job.image.imagePath : '/image/pic.png'}"
                                 alt="Preview">
                        </div>
                        <div class="imgs-text">เปลี่ยนรูปภาพงาน</div>
                        <input type="file" id="image-upload" name="image"
                               accept="image/*" style="display:none;">
                    </div>
                </label>

                <!-- วันที่ -->
                <div class="job-date">
                    <div class="date-text">วันที่เปิดรับสมัคร</div>
                    <div class="date-row">
                        <input type="date" name="openDate" required
                               th:value="${job.openDate}" />
                    </div>

                    <hr style="border: none; border-top: 1px solid #929292; margin: 15px 0;">

                    <div class="date-text">วันที่ปิดรับสมัคร</div>
                    <div class="date-row">
                        <input type="date" name="closeDate" required
                               th:value="${job.closeDate}" />
                    </div>
                </div>

            </div>

        </div>

        <!-- ปุ่ม Save / Back -->
        <div class="savenback-btn">
            <div class="save-btn">
                <button type="submit" class="job-save">Save</button>
            </div>
            <div class="back-btn">
                <a th:href="@{/teacher/jobs}" class="job-back">Cancel</a>
            </div>
        </div>

    </form>
</div>

<div class="footer">
    © 2025 VolunteeU — Software Project Recruitment
</div>


</body>
</html>
