<!DOCTYPE html>
<html lang="th"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>ใบสมัครของฉัน</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div class="navbar">
        <div class="logo">VolunteeU</div>
        <div class="nav-links">
            <a href="/">Home</a>

            <th:block sec:authorize="hasRole('STUDENT')">
                <a th:href="@{/student/applications}" class="active" style="font-weight: bold;">Application</a>
            </th:block>

            <th:block sec:authorize="hasRole('TEACHER')">
                <a th:href="@{/teacher/jobs}">Posts</a>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/profile}">Profile</a>


                <!-- 🔔 กระดิ่งแจ้งเตือน -->
                <div class="notification-container">
                    <a href="#" class="notification-bell" onclick="toggleNotificationPopup(event)">
                        <i data-lucide="bell"></i>
                        <span class="badge" th:text="${notificationCount}"
                              th:if="${notificationCount > 0}"></span>
                    </a>
                    <!-- กล่อง popup -->
                    <div id="notification-box" class="notification-popup">
                        <h3><strong>Notifications</strong></h3>
                        <ul th:if="${notifications != null && !notifications.isEmpty()}">
                            <!-- message ที่จะแจ้งใน noti -->
                            <li th:each="noti : ${notifications}"><a th:href="@{${noti.linkUrl}}" th:text="${noti.description}">ข้อความ</a>
                                
                                <div class="notif-time" th:text="${#temporals.format(noti.createdAt, 'dd MMM yyyy, HH:mm', 'Asia/Bangkok')}">
                                    เวลา
                                </div>
                            </li>
                        </ul>
                        <div th:if="${notifications == null || notifications.isEmpty()}" style="padding: 10px;">
                            ไม่มีการแจ้งเตือน
                        </div>
                    </div>
                </div>

               
            </th:block>

            <th:block sec:authorize="isAnonymous()">
                <a href="/login">Login</a>
            </th:block>
        </div>
    </div>

    <div class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>My Applications</h1>
            </div>

            <div class="application-list" th:if="${apps != null and !apps.isEmpty()}">
                <div class="application-card" th:each="a : ${apps}">
                    <!-- หัวเรื่อง + วันที่ (ชิดซ้ายสุด) -->
                    <div class="application-details">
                        <div class="job-title" th:text="${a.job.title}"></div>
                        <p class="application-date"
                           th:text="${'Applied on: ' + #temporals.format(a.appliedAt, 'MMM dd, yyyy')}"></p>
                    </div>

                    <!-- สถานะ/ปุ่ม -->
                    <div class="status-container">
                        <span class="status-badge" th:text="${a.status}"
                              th:classappend="'status-' + ${#strings.toLowerCase(a.status)}">Status</span>
                        <a href="#" class="view-link">view</a>
                    </div>

                    <!-- รายละเอียด -->
                    <div class="application-extra">
                        <div class="job-details">
                            <p><b>Description:</b></p>
                            <p th:text="${a.job.description}"></p>
                            <hr>

                            <!-- Progress -->
                            <div class="status-progresssion"
                                 th:classappend="('status-is-' + ${#strings.toLowerCase(a.status.toString())}) + 
                                                (${a.rejectedAtStatus != null} ? ' rejected-at-' + ${#strings.toLowerCase(a.rejectedAtStatus.toString())} : '')">

                                <div class="normal-track">
        
                                    <div class="step completed">
                                        <div class="circle"></div>
                                        Submitted
                                    </div>
                                
                                    <div class="step" th:classappend="
                                         (${a.status.toString() == 'PENDING'} ? 'active' : '') + 
                                         (${a.rejectedAtStatus != null && a.rejectedAtStatus.toString() == 'PENDING'} ? 'rejected' : '') +
                                         (${
                                            a.status.toString() == 'INTERVIEW' || 
                                            a.status.toString() == 'APPROVED' || 
                                            (a.rejectedAtStatus != null && (
                                                a.rejectedAtStatus.toString() == 'INTERVIEW' || 
                                                a.rejectedAtStatus.toString() == 'APPROVED'
                                            ))
                                         } ? 'completed' : '')">
                                     
                                        <div class="circle"></div>
                                        Under Review
                                    </div>
                                
                                    <div class="step" th:classappend="
                                         (${a.status.toString() == 'INTERVIEW'} ? 'active' : '') +
                                         (${a.rejectedAtStatus != null && a.rejectedAtStatus.toString() == 'INTERVIEW'} ? 'rejected' : '') +
                                         (${
                                            a.status.toString() == 'APPROVED' || 
                                            (a.rejectedAtStatus != null && a.rejectedAtStatus.toString() == 'APPROVED')
                                         } ? 'completed' : '')">
                                         
                                        <div class="circle"></div>
                                        Interview
                                    </div>
                                
                                    <div class="step" th:classappend="
                                         (${a.status.toString() == 'APPROVED'} ? 'completed' : '') +
                                         (${a.rejectedAtStatus != null && a.rejectedAtStatus.toString() == 'APPROVED'} ? 'rejected' : '')">
                                        
                                        <div class="circle"></div>
                                        Accepted
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="no-applications" th:if="${apps == null or apps.isEmpty()}">
                <p>You have not submitted any applications yet.</p>
            </div>
        </div>
    </div>

    <div class="footer">
        © 2025 VolunteeU — Software Project Recruitment
    </div>

    <script>
      // toggle view/hide
      document.addEventListener("DOMContentLoaded", function() {
        document.querySelectorAll(".view-link").forEach(function(link) {
          link.addEventListener("click", function(e) {
            e.preventDefault();
            const card  = e.target.closest(".application-card");
            const extra = card.querySelector(".application-extra");
            const shown = extra.style.display === "block";
            extra.style.display = shown ? "none" : "block";
            e.target.textContent = shown ? "view" : "hide";
          });
        });
      });
    </script>

    <script>
        lucide.createIcons();

        function toggleNotificationPopup(event) {
            event.preventDefault();
            const popup = document.getElementById('notification-box');
            popup.classList.toggle('show');
        }

        //ปิด popup เมื่อคลิกข้างนอก
        document.addEventListener('click', function (event) {
            const popup = document.getElementById('notification-box');
            const bell = document.querySelector('.notification-bell');

            if (!popup.contains(event.target) && !bell.contains(event.target)) {
                popup.classList.remove('show');
            }
        });
    </script>

</body>
</html>
