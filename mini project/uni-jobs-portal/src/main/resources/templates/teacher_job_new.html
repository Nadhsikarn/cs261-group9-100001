<!DOCTYPE html>
<html lang="th"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>สร้างงานใหม่</title>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/teacher_job_new.css">
</head>
<body>
  <div class="navbar">
    <div class="logo">VolunteeU</div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/teacher/jobs" class="active" style="font-weight: bold;">Posts</a>
        <a th:href="@{/teacher/applicant}">Applicant</a>
        <a th:href="@{/teacher/interview}">Interview</a>
        <a th:href="@{/teacher/final}">Final</a>
      <a href="/profile">Profile</a>
      
    </div>
  </div>

  <div class="main-content">
    <h2>สร้างงานใหม่</h2>

    <form method="post" th:action="@{/teacher/jobs}" enctype="multipart/form-data">
      <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />

      <div class="job-bigbox">
        <div class="job-name">
          <label>ชื่อเรื่อง</label><br/>
          <input type="text" name="title" required style="width:35%"/>
        </div>

        <div class="job-desc">
          <label>รายละเอียด</label><br/>
          <textarea name="description" required style="width:35%;height:120px"></textarea>
        </div>

         <div class="job-quiz">
          <label>Skill ที่ต้องการในแต่ละฝ่าย</label><br/>
          <textarea name="requiredSkill" required style="width:35%;height:80px"></textarea>
        </div>
        <div class="job-date">
          <label>วันที่เปิดรับสมัคร</label><br/>
          <input type="date" name="openDate" required style="width:35%" />
          <br/>
          <label>วันที่ปิดรับสมัคร</label><br/>
          <input type="date" name="closeDate" required style="width:35%" />
        </div>
      </div>

      <div class="job-img">
        <label>อัปโหลดรูปภาพ</label><br/>
        <input type="file" name="image" accept="image/*" style="width:35%"/>
      </div>

      <div class="job-question-section">
      <div class="question-header">
        <h3>คำถามสำหรับผู้สมัคร</h3>
        <button type="button" class="add-question-btn" onclick="openQuestionModal()">+ เพิ่มคำถามใหม่</button>
      </div>

      <div id="questionList"></div>
      <div id="hiddenInputs"></div>
    </div>

      <div class="modal-overlay" id="questionModal">
        <div class="modal">
          <button type="button" class="close-btn" onclick="closeQuestionModal()">×</button>
          <h2>เพิ่มคำถามใหม่ (ข้อมูลส่วนตัว)</h2>
          <textarea id="questionInput" placeholder="ใส่คำถาม...."></textarea>
          <button type="button" class="save-btn" onclick="saveQuestion()">บันทึก</button>
        </div>
      </div>

      <div class="job-department">
        <label>ฝ่ายที่ต้องการ</label><br/>
        <div id="departmentContainer">
          <input type="text" name="departments" placeholder="เช่น ฝ่ายต้อนรับ" style="width:35%; padding:5px;" />
        </div>
        <button type="button" onclick="addDepartment()" style="margin-top:5px;">+ เพิ่มฝ่าย</button>
      </div>

      <div class="savenback-btn">
        <div class="save-btn">
          <button type="submit" class="job-save">บันทึก</button>
        </div>
        <div class="back-btn">
          <a href="/teacher/jobs" class="job-back">ย้อนกลับ</a>
        </div>
      </div>
    </form>
  </div>

  <div class="footer">
    © 2025 VolunteeU — Software Project Recruitment
  </div>

  <script>
  let modal = document.getElementById("questionModal");
  let questionInput = document.getElementById("questionInput");
  let questionList = document.getElementById("questionList");
  let hiddenInputs = document.getElementById("hiddenInputs");

  function openQuestionModal() {
    modal.style.display = "flex";
    questionInput.value = "";
  }

  function closeQuestionModal() {
    modal.style.display = "none";
  }  

  function saveQuestion() {
    const text = questionInput.value.trim();
    if (!text) {
      alert("กรุณากรอกคำถามก่อนบันทึก");
      return;
    }

    const item = document.createElement("div");
    item.className = "question-item";
    item.textContent = text;
    questionList.appendChild(item);

    const hidden = document.createElement("input");
    hidden.type = "hidden";
    hidden.name = "questions";
    hidden.value = text;
    hiddenInputs.appendChild(hidden);

    closeQuestionModal();
  }

  window.onclick = function(event) {
    if (event.target === modal) {
      closeQuestionModal();
    }
  }

  function addDepartment() {
  const container = document.getElementById("departmentContainer");
  const input = document.createElement("input");
  input.type = "text";
  input.name = "departments";
  input.placeholder = "เพิ่มฝ่ายอื่น ๆ";
  input.style = "width:35%; margin-top:5px; margin-right:5px; padding:5px;";
  container.appendChild(input);
  }
</script>

</body>
</html>
